name: Java CI

on: [push]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    # JDK 17: required by Gradle 9, and matches the jvmToolchain(17) the build
    # now declares. (It was 8 until webp-imageio, which ships Java 9 bytecode,
    # made resolution fail with "no matching variant".)
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
    # A step's `if` can read the `env` context but not `secrets`, so the test
    # happens here, in the one place that is allowed to see the value. Passing
    # it as a job-level `env` instead would put the key in the environment of
    # every step, `./gradlew test` included, for no reason.
    - name: Check for an age identity
      id: age
      env:
        SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
      run: |
        if test -n "${SOPS_AGE_KEY}" ; then
          echo "present=true" >> "$GITHUB_OUTPUT"
        else
          echo "present=false" >> "$GITHUB_OUTPUT"
          echo "SOPS_AGE_KEY is not set, so the sops decrypt is skipped." >&2
        fi
    # sops is not on the runner image. Pinned to a version and its published
    # checksum, so a replaced release cannot silently become the thing that
    # reads this repository's secrets.
    - name: Install sops
      if: steps.age.outputs.present == 'true'
      run: |
        curl -fsSLo /tmp/sops https://github.com/getsops/sops/releases/download/v3.13.3/sops-v3.13.3.linux.amd64
        echo "e5bec3346a873ae91d871550f3e698c1aad962aff462a080e40f25fde17fef6b  /tmp/sops" | sha256sum -c -
        chmod +x /tmp/sops
        sudo mv /tmp/sops /usr/local/bin/sops
    # Writes the plaintext _tools/secrets/build_secrets.gradle.kts that
    # build.gradle.kts applies as a Gradle script. SOPS_AGE_KEY is the private
    # half of this repository's CI age key; see .sops.yaml for the recipients.
    # It replaced BLACKBOX_SECRET when secret handling moved to sops.
    #
    # Skipped when that secret is not configured, which is also what a pull
    # request from a fork sees. Nothing in this job actually needs it:
    # build.gradle.kts treats the file as optional and warns, and only `publish`
    # uses the values in it, from repository secrets of its own. The step is
    # here so that every push proves the sops setup still decrypts, instead of
    # finding that out on release day -- so when the secret IS set, a failure
    # here is real and fails the build.
    - name: Postdeploy
      if: steps.age.outputs.present == 'true'
      env:
        SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
      run: _tools/postdeploy.sh
    # Publishing is not part of this job any more: OSSRH reached EOL on
    # 2025-06-30 and both of its hosts now 404, so the old `publish` step failed
    # every run. Releases happen on a tag, in the job below.
    - name: Test with Gradle
      run: ./gradlew test

  publish:
    # Releases are cut by tag: `git tag v0.3.0 && git push origin v0.3.0`.
    # The tag name is the version, so nothing in the repository has to be
    # edited to release; build.gradle.kts keeps 0.3.0-SNAPSHOT for development.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
    # No sops here: the signing key and the Portal token come from repository
    # secrets, so this job does not need the encrypted build_secrets.gradle.kts.
    # SIGNING_KEY is the armoured private key (`gpg --armor --export-secret-keys`).
    - name: Publish to the Central Portal staging repository
      env:
        CENTRAL_TOKEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
        CENTRAL_TOKEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
        SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
      run: ./gradlew publish -Pversion=${GITHUB_REF_NAME#v}
    # Same job as the upload on purpose: Sonatype accepts this only from the IP
    # that uploaded. It leaves the deployment for you to release in the Portal;
    # pass `automatic` to release without confirmation.
    - name: Hand the staged deployment to the Portal
      env:
        CENTRAL_TOKEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
        CENTRAL_TOKEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
      run: _tools/central-publish.sh

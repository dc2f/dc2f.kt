name: Java CI

on: [push]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    # JDK 11, not 8: webp-imageio (the WebP encoder with aarch64 natives) ships
    # Java 9 bytecode, so resolution fails outright on a Java 8 consumer with
    # "no matching variant". 11 is also what the sites build with locally.
    # kotlinOptions.jvmTarget stays 1.8 -- that is the output target, unrelated
    # to the JDK doing the compiling.
    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '11'
    - name: Postdeploy
      env:
        BLACKBOX_SECRET: ${{ secrets.BLACKBOX_SECRET }}
      run: _tools/postdeploy.sh
    # `publish` dropped: it targeted oss.sonatype.org, which Sonatype
    # decommissioned when OSSRH reached EOL on 2025-06-30 -- both endpoints now
    # return 404/402, so this step could never succeed and had been failing
    # every run. Nothing has been published since 2019 and every consumer
    # (codeux.design, authpass.app-website) resolves dc2f via includeBuild, so
    # CI is more useful just running the tests. Republishing would mean
    # migrating to the Central Portal and untangling the version numbering
    # first -- dc2f.kt declares 0.1.3-SNAPSHOT while 0.2.1 is already on Central.
    - name: Test with Gradle
      run: ./gradlew test
